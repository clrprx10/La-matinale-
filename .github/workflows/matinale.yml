name: La Matinale

on:
  workflow_dispatch:
  schedule:
    - cron: '35 4,5 * * *'

permissions:
  contents: write

concurrency:
  group: matinale-production
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le créneau parisien (ou lancement manuel)
        id: time
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          HOUR=$(TZ=Europe/Paris date +%H)
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$HOUR" = "06" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.time.outputs.go == 'true'
      - uses: actions/setup-python@v5
        if: steps.time.outputs.go == 'true'
        with:
          python-version: '3.11'
      - name: Installer les dépendances
        if: steps.time.outputs.go == 'true'
        run: pip install -r requirements.txt
      - name: Générer le journal
        if: steps.time.outputs.go == 'true'
        run: python generate.py
      - name: Enregistrer l'édition
        if: steps.time.outputs.go == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/edition.json docs/matinale.mp3
          if ! git diff --cached --quiet; then
            git commit -m "Publier La Matinale"
            git push
          fi

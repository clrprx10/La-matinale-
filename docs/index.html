<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Matinale</title><style>body{font-family:system-ui,sans-serif;max-width:750px;margin:3rem auto;padding:0 1rem;line-height:1.6;color:#18243b}h1{color:#123f75}audio{width:100%;margin:1rem 0}article{border-top:1px solid #ddd;padding:1rem 0}small{color:#555}a{overflow-wrap:anywhere}</style></head><body><h1>📻 La Matinale</h1><p>Votre revue audio de publications sourcées.</p><div id="content">Chargement de l'édition…</div><script>
fetch('edition.json?x='+Date.now()).then(r=>{if(!r.ok)throw Error('Aucune édition');return r.json()}).then(d=>{
const c=document.getElementById('content');c.replaceChildren();
const h=document.createElement('h2');h.textContent='Édition du '+d.date;c.append(h);
const a=document.createElement('audio');a.controls=true;a.preload='none';a.src=d.audio+'?d='+encodeURIComponent(d.date);c.append(a);
const n=document.createElement('p');n.textContent=d.notice||'';c.append(n);
const h3=document.createElement('h2');h3.textContent='Les sujets et leurs sources';c.append(h3);
for(const s of d.stories||[]){const ar=document.createElement('article');const t=document.createElement('h3');t.textContent=s.title;const p=document.createElement('p');p.textContent=s.theme+' · '+s.source+' · '+s.date;const l=document.createElement('a');l.href=s.url;l.target='_blank';l.rel='noopener noreferrer';l.textContent='Lire la publication originale';ar.append(t,p,l);c.append(ar)}
const th=document.createElement('h2');th.textContent='Transcription';const pre=document.createElement('p');pre.style.whiteSpace='pre-wrap';pre.textContent=d.transcript||'';c.append(th,pre);
}).catch(()=>{document.getElementById('content').textContent='Aucune édition disponible pour le moment. Le programme ne publie pas sans sources Éducation datées.'});
</script></body></html>
